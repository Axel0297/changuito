name: Actualizar dataset

# SEPA republica el ZIP del dia alrededor de las 16:20 ART. Se corre despues,
# a las 19:00 ART (22:00 UTC), para tomar siempre la version del dia.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      localidad:
        description: 'Localidad (vacío = Trelew). Ver localidades con: npm run localidades'
        required: false
        default: ''
      radio:
        description: 'Radio en km desde el centro de la localidad'
        required: false
        default: '60'

# Zona que se publica en las corridas automaticas. Para mudar la app a otra
# ciudad alcanza con cambiar esto (y regenerar el asset del bundle).
env:
  LOCALIDAD: ${{ inputs.localidad || '' }}
  RADIO: ${{ inputs.radio || '60' }}

permissions:
  contents: read
  pages: write
  id-token: write

# Si una corrida se solapa con otra, gana la mas nueva.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Descarga el ZIP nacional (~336 MB) y lo recorta a la zona elegida.
      - name: Generar el dataset
        run: |
          mkdir -p publico
          if [ -n "$LOCALIDAD" ]; then
            node etl/build-dataset.mjs --localidad "$LOCALIDAD" --radio "$RADIO" --salida publico/dataset.json
          else
            node etl/build-dataset.mjs --radio "$RADIO" --salida publico/dataset.json
          fi

      # Falla ruidosamente si el ETL emitio algo vacio, en vez de publicar
      # un dataset roto encima del que ya funcionaba.
      - name: Verificar la salida
        run: |
          node -e "
            const d = require('./publico/dataset.json');
            const ok = d.sucursales.length > 0 && d.productos.length > 1000 && d.precios.length > 1000;
            if (!ok) {
              console.error('dataset sospechoso:', {
                sucursales: d.sucursales.length,
                productos: d.productos.length,
                precios: d.precios.length,
              });
              process.exit(1);
            }
            console.log('dataset de', d.centro.nombre, 'del', d.fecha_datos + ':',
                        d.sucursales.length, 'sucursales,', d.productos.length, 'productos,',
                        d.precios.length, 'precios');
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico

      - id: deploy
        uses: actions/deploy-pages@v4
